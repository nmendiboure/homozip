[build-system]
requires = ["setuptools>=74.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homozip"
description = "The mismatch-limited zipper: a minimal stochastic model of homology search"
dynamic = ["version"]
readme = "README.md"
license = {text = "GPLv3"}
authors = [
    {name = "Nicolas Mendiboure", email = "nicolas.mendiboure@ens-lyon.fr"}
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: Unix",
    "Operating System :: MacOS"
]
requires-python = "~=3.12"
dependencies = [
    "matplotlib~=3.9.2",
    "numpy>=1.26.0,<2.0",
    "pyyaml~=6.0.2",
    "scipy==1.14.1",
    "tellurium==2.2.10",
]

[project.urls]
Homepage = "https://github.com/nmendiboure/homozip"

[project.scripts]
homozip = "homozip.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "homozip.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 120
